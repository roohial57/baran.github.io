name: Build portfolio for GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-root
  cancel-in-progress: true

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish static site to repo root
        run: npm run build:pages

      - name: Commit published site if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html favicon.svg .nojekyll _astro robots.txt sitemap*.xml
          git add -u CNAME public/CNAME 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No site artifact changes"
            exit 0
          fi
          git commit -m "chore: rebuild static portfolio for GitHub Pages"
          git push
